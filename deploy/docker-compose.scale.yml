name: gravity-chamber-scale

services:
  scouter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: scouter:dev
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      DATABASE_URL: "postgres://scouter:kamehameha@postgres:5432/scouter?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3
    # No host port mapping: three containers cannot share port 8080.
    # nginx below is the single entry point.

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - scouter

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scouter
      POSTGRES_PASSWORD: kamehameha      # local only — see the note below
      POSTGRES_DB: scouter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # *.sql here runs on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouter"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  pgdata: