name: gravity-chamber-scale

services:
  scouter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: scouter:dev
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
    deploy:
      replicas: 3
    # No host port mapping: three containers cannot share port 8080.
    # nginx below is the single entry point.

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - scouter