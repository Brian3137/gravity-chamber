name: gravity-chamber

services:
  scouter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: scouter:dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"   # from your shell, with a default
      DATABASE_URL: "postgres://scouter:kamehameha@postgres:5432/scouter?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # distroless has no shell and no curl, so we use the binary's own
      # ability to... not do this. See the note below — this is why the
      # healthcheck lives outside the container in compose.
      test: ["CMD", "/scouter", "-health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s

  # A stand-in load generator. Capsule 09 replaces it with k6.
  pinger:
    image: alpine:3.20
    depends_on:
      - scouter
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             while true; do
               curl -s -o /dev/null http://scouter:8080/healthz;
               sleep 2;
             done"
    profiles: ["load"]      # only starts with: --profile load

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scouter
      POSTGRES_PASSWORD: kamehameha      # local only — see the note below
      POSTGRES_DB: scouter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # *.sql here runs on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouter"]
      interval: 3s
      timeout: 2s
      retries: 10
  
  shard0:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scouter
      POSTGRES_PASSWORD: kamehameha
      POSTGRES_DB: scouter
    ports:
      - "5433:5432"
    volumes:
      - shard0data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouter"]
      interval: 3s
      timeout: 2s
      retries: 10


  
  shard1:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scouter
      POSTGRES_PASSWORD: kamehameha
      POSTGRES_DB: scouter
    ports:
      - "5434:5432"
    volumes:
      - shard1data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouter"]
      interval: 3s
      timeout: 2s
      retries: 10

  
volumes:
  pgdata:
  shard0data:
  shard1data: